name: Comprehensive DataProf Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Unit Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Lint and format check
        run: |
          ruff check scripts test
          ruff format --check scripts test

      - name: Run unit tests
        run: pytest -v

  test-pass:
    name: Pass (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check clean CSV
        id: clean
        uses: ./
        with:
          file: test/data/csv/clean_data.csv
          quality-threshold: '80'
          export-json-path: output/clean.json
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert pass outputs
        env:
          VERDICT: ${{ steps.clean.outputs.verdict }}
          QUALITY_SCORE: ${{ steps.clean.outputs.quality-score }}
          COMPLETENESS_SCORE: ${{ steps.clean.outputs.completeness-score }}
          PRECISION_SCORE: ${{ steps.clean.outputs.precision-score }}
          VIOLATIONS_COUNT: ${{ steps.clean.outputs.violations-count }}
          UNEVALUATED_COUNT: ${{ steps.clean.outputs.unevaluated-count }}
          ERRORS_COUNT: ${{ steps.clean.outputs.errors-count }}
          SKIPPED_COUNT: ${{ steps.clean.outputs.skipped-count }}
          FILES_ANALYZED: ${{ steps.clean.outputs.files-analyzed }}
          JSON_EXPORT_PATH: ${{ steps.clean.outputs.json-export-path }}
          REPORT_PATH: ${{ steps.clean.outputs.report-path }}
        run: |
          test "$VERDICT" = "pass"
          test -n "$QUALITY_SCORE"
          test -n "$COMPLETENESS_SCORE"
          test -z "$PRECISION_SCORE"
          test "$VIOLATIONS_COUNT" = "0"
          test "$UNEVALUATED_COUNT" = "0"
          test "$ERRORS_COUNT" = "0"
          test "$SKIPPED_COUNT" = "0"
          test "$FILES_ANALYZED" = "1"
          test -f "$JSON_EXPORT_PATH"
          test -f "$REPORT_PATH"

  test-fail:
    name: Fail (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dirty CSV with fail-on-issues false
        id: dirty
        uses: ./
        with:
          file: test/data/csv/dirty_data.csv
          quality-threshold: '95'
          fail-on-issues: 'false'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert fail outputs when continuing
        env:
          VERDICT: ${{ steps.dirty.outputs.verdict }}
          VIOLATIONS_COUNT: ${{ steps.dirty.outputs.violations-count }}
          FILES_ANALYZED: ${{ steps.dirty.outputs.files-analyzed }}
          QUALITY_SCORE: ${{ steps.dirty.outputs.quality-score }}
        run: |
          test "$VERDICT" = "fail"
          test "$VIOLATIONS_COUNT" = "1"
          test "$FILES_ANALYZED" = "1"
          test -n "$QUALITY_SCORE"

      - name: Check dirty CSV with fail-on-issues true
        id: dirty-strict
        continue-on-error: true
        uses: ./
        with:
          file: test/data/csv/dirty_data.csv
          quality-threshold: '95'
          fail-on-issues: 'true'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert strict fail exits non-zero
        env:
          OUTCOME: ${{ steps.dirty-strict.outcome }}
          VERDICT: ${{ steps.dirty-strict.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "fail"

  test-inconclusive:
    name: Inconclusive (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check capped scan under full_source with fail-on-inconclusive false
        id: inconc
        uses: ./
        with:
          file: test/data/csv/large_dataset.csv
          quality-threshold: '80'
          max-rows: '5'
          scope: full_source
          fail-on-inconclusive: 'false'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert inconclusive outputs
        env:
          VERDICT: ${{ steps.inconc.outputs.verdict }}
          VIOLATIONS_COUNT: ${{ steps.inconc.outputs.violations-count }}
          UNEVALUATED_COUNT: ${{ steps.inconc.outputs.unevaluated-count }}
          FILES_ANALYZED: ${{ steps.inconc.outputs.files-analyzed }}
        run: |
          test "$VERDICT" = "inconclusive"
          test "$VIOLATIONS_COUNT" = "0"
          test "$UNEVALUATED_COUNT" = "1"
          test "$FILES_ANALYZED" = "1"

      - name: Check capped scan under full_source with fail-on-inconclusive true
        id: inconc-strict
        continue-on-error: true
        uses: ./
        with:
          file: test/data/csv/large_dataset.csv
          quality-threshold: '80'
          max-rows: '5'
          scope: full_source
          fail-on-inconclusive: 'true'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert strict inconclusive exits non-zero
        env:
          OUTCOME: ${{ steps.inconc-strict.outcome }}
          VERDICT: ${{ steps.inconc-strict.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "inconclusive"

  test-error:
    name: Error (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check missing source
        id: missing
        continue-on-error: true
        uses: ./
        with:
          file: test/data/csv/does_not_exist.csv
          quality-threshold: '80'
          fail-on-issues: 'false'
          fail-on-inconclusive: 'false'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert missing source always fails
        env:
          OUTCOME: ${{ steps.missing.outcome }}
          VERDICT: ${{ steps.missing.outputs.verdict }}
          ERRORS_COUNT: ${{ steps.missing.outputs.errors-count }}
          FILES_ANALYZED: ${{ steps.missing.outputs.files-analyzed }}
          QUALITY_SCORE: ${{ steps.missing.outputs.quality-score }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "error"
          test "$ERRORS_COUNT" = "1"
          test "$FILES_ANALYZED" = "0"
          test -z "$QUALITY_SCORE"

      - name: Check malformed JSON source
        id: malformed
        continue-on-error: true
        uses: ./
        with:
          file: test/data/invalid/malformed.json
          quality-threshold: '80'
          fail-on-issues: 'false'
          fail-on-inconclusive: 'false'
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert malformed source always fails
        env:
          OUTCOME: ${{ steps.malformed.outcome }}
          VERDICT: ${{ steps.malformed.outputs.verdict }}
          ERRORS_COUNT: ${{ steps.malformed.outputs.errors-count }}
          FILES_ANALYZED: ${{ steps.malformed.outputs.files-analyzed }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "error"
          test "$ERRORS_COUNT" = "1"
          test "$FILES_ANALYZED" = "0"

  test-multi-source:
    name: Multi-source Directory (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check batch directory
        id: batch
        uses: ./
        with:
          file: test/data/batch/
          quality-threshold: '80'
          export-json-path: output/batch.json
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert multi-source outputs
        env:
          VERDICT: ${{ steps.batch.outputs.verdict }}
          FILES_ANALYZED: ${{ steps.batch.outputs.files-analyzed }}
          VIOLATIONS_COUNT: ${{ steps.batch.outputs.violations-count }}
          ERRORS_COUNT: ${{ steps.batch.outputs.errors-count }}
          SKIPPED_COUNT: ${{ steps.batch.outputs.skipped-count }}
          QUALITY_SCORE: ${{ steps.batch.outputs.quality-score }}
          COMPLETENESS_SCORE: ${{ steps.batch.outputs.completeness-score }}
          REPORT_PATH: ${{ steps.batch.outputs.report-path }}
          JSON_EXPORT_PATH: ${{ steps.batch.outputs.json-export-path }}
        run: |
          test "$VERDICT" = "pass"
          test "$FILES_ANALYZED" = "5"
          test "$VIOLATIONS_COUNT" = "0"
          test "$ERRORS_COUNT" = "0"
          test "$SKIPPED_COUNT" = "0"
          test -z "$QUALITY_SCORE"
          test -z "$COMPLETENESS_SCORE"
          test -z "$REPORT_PATH"
          test -f "$JSON_EXPORT_PATH"

  test-baseline-flow:
    name: Baseline First Run and Promotion (${{ matrix.os }}, dataprof ${{ matrix.dataprof-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dataprof-version: ['0.15.0rc1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: First run with allow-missing-baseline and promote
        id: run1
        uses: ./
        with:
          file: test/data/csv/clean_data.csv
          policy: test/data/policies/baseline.json
          baseline: ${{ runner.temp }}/clean_baseline.json
          allow-missing-baseline: 'true'
          promote: ${{ runner.temp }}/clean_baseline.json
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert first run passed and wrote baseline
        env:
          VERDICT: ${{ steps.run1.outputs.verdict }}
          VIOLATIONS_COUNT: ${{ steps.run1.outputs.violations-count }}
          BASELINE_FILE: ${{ runner.temp }}/clean_baseline.json
        run: |
          test "$VERDICT" = "pass"
          test "$VIOLATIONS_COUNT" = "0"
          test -f "$BASELINE_FILE"

      - name: Second run against promoted baseline
        id: run2
        uses: ./
        with:
          file: test/data/csv/clean_data.csv
          policy: test/data/policies/baseline.json
          baseline: ${{ runner.temp }}/clean_baseline.json
          promote: ${{ runner.temp }}/clean_baseline.json
          dataprof-version: ${{ matrix.dataprof-version }}

      - name: Assert second run used baseline and passed
        env:
          VERDICT: ${{ steps.run2.outputs.verdict }}
          VIOLATIONS_COUNT: ${{ steps.run2.outputs.violations-count }}
          FILES_ANALYZED: ${{ steps.run2.outputs.files-analyzed }}
        run: |
          test "$VERDICT" = "pass"
          test "$VIOLATIONS_COUNT" = "0"
          test "$FILES_ANALYZED" = "1"
