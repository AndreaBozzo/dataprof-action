name: 'DataProf Data Quality Assessment'
description: 'Profile CSV, JSON, JSONL, and Parquet files and enforce data quality gates with dataprof.'
author: 'Andrea Bozzo'

branding:
  icon: 'database'
  color: 'blue'

inputs:
  file:
    description: 'File, directory, or glob pattern to check; space- or newline-separated for multiple sources. Supports CSV, TSV, JSON, JSONL/NDJSON, and Parquet.'
    required: true

  recursive:
    description: 'Recurse into subdirectories when a directory source is passed (-r)'
    required: false
    default: 'false'

  quality-threshold:
    description: 'Minimum overall quality score (0-100), passed to --min-quality. Empty by default.'
    required: false
    default: ''

  policy:
    description: 'Path to a UTF-8 JSON policy file, or the policy itself as inline JSON starting with "{" (--policy)'
    required: false
    default: ''

  scope:
    description: 'Evidence scope required by the gate: full_source or observed (--scope)'
    required: false
    default: ''

  max-rows:
    description: 'Cap the number of profiled rows (--max-rows)'
    required: false
    default: ''

  source-version:
    description: 'Version identifier for the source being checked (--source-version)'
    required: false
    default: ''

  baseline:
    description: 'Path to a saved baseline profile report JSON (--baseline; single source only)'
    required: false
    default: ''

  allow-missing-baseline:
    description: 'Allow an absent baseline file so absolute rules decide the first run (--allow-missing-baseline; single source only)'
    required: false
    default: 'false'

  promote:
    description: 'Path to atomically save the profile report when the gate passes (--promote; single source only)'
    required: false
    default: ''

  fail-on-issues:
    description: 'Fail the step when dataprof reports a proven policy violation (exit 1)'
    required: false
    default: 'true'

  fail-on-inconclusive:
    description: 'Fail the step when dataprof reports an inconclusive verdict (exit 2); exit 3 always fails'
    required: false
    default: 'true'

  export-json-path:
    description: 'Optional path to write the raw --json document produced by dataprof.check'
    required: false
    default: ''

  dataprof-version:
    description: 'Version of dataprof to install from PyPI (minimum 0.14.1, default 0.14.1; supports latest and exact pre-releases)'
    required: false
    default: '0.14.1'

  python-version:
    description: 'Optional Python version to install with actions/setup-python (must be 3.11 or newer)'
    required: false
    default: ''

outputs:
  verdict:
    description: 'Gate verdict reported by dataprof: pass, fail, inconclusive, or error'
    value: ${{ steps.quality-analysis.outputs.verdict }}

  quality-score:
    description: 'Overall data quality score (0-100) from the saved profile report; single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.quality-score }}

  completeness-score:
    description: 'Completeness dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.completeness-score }}

  uniqueness-score:
    description: 'Uniqueness dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.uniqueness-score }}

  validity-score:
    description: 'Validity dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.validity-score }}

  consistency-score:
    description: 'Consistency dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.consistency-score }}

  timeliness-score:
    description: 'Timeliness dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.timeliness-score }}

  accuracy-score:
    description: 'Accuracy dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.accuracy-score }}

  precision-score:
    description: 'Precision dimension score (0-100); single source only, empty when absent'
    value: ${{ steps.quality-analysis.outputs.precision-score }}

  violations-count:
    description: 'Number of checks with status failed across evaluated sources'
    value: ${{ steps.quality-analysis.outputs.violations-count }}

  unevaluated-count:
    description: 'Number of checks with status not_evaluated across evaluated sources'
    value: ${{ steps.quality-analysis.outputs.unevaluated-count }}

  errors-count:
    description: 'Number of source or invocation errors'
    value: ${{ steps.quality-analysis.outputs.errors-count }}

  skipped-count:
    description: 'Number of skipped files in a multi-source run'
    value: ${{ steps.quality-analysis.outputs.skipped-count }}

  file-path:
    description: 'The file input passed to the action'
    value: ${{ steps.quality-analysis.outputs.file-path }}

  files-analyzed:
    description: 'Number of sources that produced a quality gate result'
    value: ${{ steps.quality-analysis.outputs.files-analyzed }}

  json-export-path:
    description: 'Path to the exported --json document when export-json-path was set'
    value: ${{ steps.quality-analysis.outputs.json-export-path }}

  report-path:
    description: 'Path to the saved full profile JSON under RUNNER_TEMP (single source only)'
    value: ${{ steps.quality-analysis.outputs.report-path }}

  analysis-summary:
    description: 'Short plain-text summary of the check'
    value: ${{ steps.quality-analysis.outputs.analysis-summary }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dataprof
      id: setup-dataprof
      shell: bash
      env:
        INPUT_DATAPROF_VERSION: ${{ inputs.dataprof-version }}
      run: |
        set -euo pipefail

        BASE_PYTHON=""
        FOUND_OLD=""
        for candidate in python python3; do
          if ! command -v "$candidate" >/dev/null 2>&1; then
            continue
          fi
          if "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' 2>/dev/null; then
            BASE_PYTHON="$candidate"
            break
          fi
          ver=$("$candidate" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))' 2>/dev/null || true)
          if [ -n "$ver" ]; then
            FOUND_OLD="$ver"
          fi
        done

        if [ -z "$BASE_PYTHON" ]; then
          if [ -n "$FOUND_OLD" ]; then
            echo "::error::Python 3.11 or newer is required (found ${FOUND_OLD}). Set the python-version input or install Python 3.11+."
          else
            echo "::error::Python 3.11 or newer is required, but no Python interpreter was found on PATH. Set the python-version input."
          fi
          exit 1
        fi

        REQUESTED="${INPUT_DATAPROF_VERSION:-0.14.1}"
        if [ "$REQUESTED" = "latest" ]; then
          RESOLVED_VERSION="$("$BASE_PYTHON" -c '
        import json, sys, urllib.request
        with urllib.request.urlopen("https://pypi.org/pypi/dataprof/json", timeout=30) as resp:
            sys.stdout.write(json.load(resp)["info"]["version"])
        ')"
        else
          RESOLVED_VERSION="$REQUESTED"
        fi

        if [ -z "$RESOLVED_VERSION" ]; then
          echo "::error::Could not resolve dataprof version from PyPI."
          exit 1
        fi

        SAFE_VERSION="${RESOLVED_VERSION//[^A-Za-z0-9._+-]/_}"
        PY_TAG="$("$BASE_PYTHON" -c 'import sys; sys.stdout.write(f"{sys.implementation.name}-{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')"
        SAFE_PY_TAG="${PY_TAG//[^A-Za-z0-9._+-]/_}"
        TEMP_ROOT="${RUNNER_TEMP:-/tmp}"
        VENV_DIR="${TEMP_ROOT}/dataprof-action-venv-${SAFE_VERSION}-${SAFE_PY_TAG}"

        find_venv_python() {
          if [ -x "$VENV_DIR/Scripts/python.exe" ]; then
            printf '%s\n' "$VENV_DIR/Scripts/python.exe"
          elif [ -x "$VENV_DIR/bin/python" ]; then
            printf '%s\n' "$VENV_DIR/bin/python"
          fi
        }

        VENV_PYTHON="$(find_venv_python || true)"
        if [ -z "$VENV_PYTHON" ] || ! "$VENV_PYTHON" -c 'import importlib.metadata, sys; raise SystemExit(0 if importlib.metadata.version("dataprof") == sys.argv[1] else 1)' "$RESOLVED_VERSION" 2>/dev/null; then
          "$BASE_PYTHON" -m venv "$VENV_DIR"
          VENV_PYTHON="$(find_venv_python || true)"
          if [ -z "$VENV_PYTHON" ]; then
            echo "::error::Failed to locate Python inside virtual environment: ${VENV_DIR}"
            exit 1
          fi
          "$VENV_PYTHON" -m pip install --disable-pip-version-check --no-input --only-binary=dataprof "dataprof==${RESOLVED_VERSION}"
        fi

        {
          echo "python=${VENV_PYTHON}"
          echo "version=${RESOLVED_VERSION}"
        } >> "$GITHUB_OUTPUT"

    - name: Run dataprof quality check
      id: quality-analysis
      shell: bash
      env:
        DATAPROF_PYTHON: ${{ steps.setup-dataprof.outputs.python }}
        ACTION_PATH: ${{ github.action_path }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_RECURSIVE: ${{ inputs.recursive }}
        INPUT_QUALITY_THRESHOLD: ${{ inputs.quality-threshold }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_MAX_ROWS: ${{ inputs.max-rows }}
        INPUT_SOURCE_VERSION: ${{ inputs.source-version }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ALLOW_MISSING_BASELINE: ${{ inputs.allow-missing-baseline }}
        INPUT_PROMOTE: ${{ inputs.promote }}
        INPUT_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        INPUT_FAIL_ON_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
        INPUT_EXPORT_JSON_PATH: ${{ inputs.export-json-path }}
        INPUT_DATAPROF_VERSION: ${{ steps.setup-dataprof.outputs.version }}
      run: '"$DATAPROF_PYTHON" "$ACTION_PATH/scripts/dataprof_action.py"'
